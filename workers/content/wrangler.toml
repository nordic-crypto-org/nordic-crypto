# Nordic Crypto stories and events (Cloudflare Workers + D1).
# Deploy steps are in README.md. Do not put secrets in this file.
# The database id below is the nordic-crypto-content D1 database.
# Secrets (wrangler secret put, never committed):
#   EDITOR_TOKEN            editor review API
#   GITHUB_DISPATCH_TOKEN   optional; starts the d1-publish workflow after an approval
name = "nordic-crypto-content"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
# Public read API for the site and the apps: https://api.nordiccrypto.no/api/v1/news.json
# (approved, published stories from D1; 60 s edge cache).
# Custom Domain, not a zone route. `wrangler deploy` attaches this hostname and
# Cloudflare creates the proxied DNS record. A zone route (api.nordiccrypto.no/*
# plus zone_name) would not create that record, so the name would stay NXDOMAIN.
# The zone nordiccrypto.no must be on this same account. Do not add a CNAME for
# api first: a CNAME already on the name blocks the custom domain.
routes = [{ pattern = "api.nordiccrypto.no", custom_domain = true }]

[observability]
enabled = false

[vars]
GITHUB_REPOSITORY = "nordic-crypto-org/nordic-crypto"

[[d1_databases]]
binding = "DB"
database_name = "nordic-crypto-content"
database_id = "ebba20cc-77a8-4d50-a753-dd46fcb8798d"
migrations_dir = "migrations"

# Story illustrations. The bucket is not created by a deploy.
# It is not the private backup bucket (CF_R2_BUCKET / nordic-crypto-content-backup).
# Create it once, on the free tier, then set the GitHub variable CF_R2_STORY_BUCKET
# to the same name. The Worker serves the objects; the bucket stays private.
[[r2_buckets]]
binding = "STORY_IMAGES"
bucket_name = "nordic-crypto-story-images"

