# Build the site from the committed JSON on every pull request. No secrets, nothing is published.
name: PR build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python3 -m pip install -r requirements.txt
      - name: Event title tests
        run: python3 -m unittest tests.test_event_title tests.test_event_translate tests.test_d1_events
      - name: Build
        run: python3 build.py
      - name: Event titles in the page language
        run: |
          set -euo pipefail
          for page in calendar/03951f33970c fa/calendar/03951f33970c tr/calendar/03951f33970c nb/calendar/03951f33970c; do
            h1=$(grep -o '<h1[^>]*>[^<]*</h1>' "site/$page/index.html")
            echo "$page: $h1" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          grep -q '<h1>Satoshi Nakamoto Annual Address 2027</h1>' site/calendar/03951f33970c/index.html
