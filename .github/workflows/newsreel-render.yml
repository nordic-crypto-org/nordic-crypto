# Renders a newsletter newsreel (newsletter/issues/<id>-video) on a runner and attaches it to a release.
name: Newsreel render
on:
  push:
    branches: ["newsletter/**"]
    paths: ["newsletter/issues/*-video/**", ".github/workflows/newsreel-render.yml"]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue id, e.g. 004"
        required: true
permissions:
  contents: write
concurrency:
  group: newsreel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick issue
        id: pick
        env:
          IN: ${{ inputs.issue }}
        run: |
          id="$IN"
          [ -z "$id" ] && id=$(ls -d newsletter/issues/*-video | sed 's#.*/##; s/-video$//' | sort | tail -1)
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "num=$((10#$id))" >> "$GITHUB_OUTPUT"
      - name: Anders on camera
        id: anchor
        working-directory: newsletter/issues/${{ steps.pick.outputs.id }}-video
        run: |
          python3 -c 'import content, os; need = "true" if getattr(content, "ANCHOR_IMG", None) else "false"; open(os.environ["GITHUB_OUTPUT"], "a").write("need=%s\n" % need); print("Anders Fjell anchor:", need)'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -r newsletter/issues/${{ steps.pick.outputs.id }}-video/requirements.txt
      - name: Wav2Lip (lip-sync the anchor to the TTS voice)
        if: steps.anchor.outputs.need == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q librosa opencv-python-headless scipy tqdm
          git clone -q https://github.com/Rudrabha/Wav2Lip.git "$RUNNER_TEMP/w2l"
          git -C "$RUNNER_TEMP/w2l" checkout -q bac9a81e63ecc153202353372e5724b83d9e6322
          hf=https://huggingface.co/camenduru/Wav2Lip/resolve/main
          curl -sfL -o "$RUNNER_TEMP/w2l/checkpoints/wav2lip_gan.pth" "$hf/checkpoints/wav2lip_gan.pth"
          curl -sfL -o "$RUNNER_TEMP/w2l/face_detection/detection/sfd/s3fd.pth" "$hf/face_detection/detection/sfd/s3fd.pth"
          (cd "$RUNNER_TEMP/w2l" && sha256sum -c - <<'SUMS'
          ca9ab7b7b812c0e80a6e70a5977c545a1e8a365a6c49d5e533023c034d7ac3d8  checkpoints/wav2lip_gan.pth
          619a31681264d3f7f7fc7a16a42cbbe8b23f31a256f75a366e5a1bcd59b33543  face_detection/detection/sfd/s3fd.pth
          SUMS
          )
          echo "WAV2LIP=$RUNNER_TEMP/w2l" >> "$GITHUB_ENV"
      - name: Render
        working-directory: newsletter/issues/${{ steps.pick.outputs.id }}-video
        run: |
          set -euo pipefail
          mkdir -p build
          python3 tts.py
          if [ "${{ steps.anchor.outputs.need }}" = "true" ]; then
            python3 "$GITHUB_WORKSPACE/newsletter/anchor_lipsync.py"  # fails if the mouth does not move
          fi
          python3 timeline.py
          python3 audio.py --style news --timeline build/timeline.json --mix build/mix.wav
          python3 -c "import json; print('\n'.join(s['name'] for s in json.load(open('build/timeline.json'))['segs']))" \
            | xargs -P "$(nproc)" -I{} python3 render.py {}
          if [ "${{ steps.anchor.outputs.need }}" = "true" ]; then
            python3 "$GITHUB_WORKSPACE/newsletter/anchor_lipsync.py" --check-rendered
          fi
          bash concat.sh build/timeline.json build build/mix.wav "build/nordic-crypto-${{ steps.pick.outputs.num }}-newsreel.mp4"
          python3 render.py thumb
          mkdir -p out && cp build/*-newsreel.mp4 thumbnail.png subs.srt script.txt build/subs.vtt out/
          ffmpeg -v error -y -i build/*-newsreel.mp4 -vf "fps=1/8,scale=320:-1,tile=5x4" -frames:v 1 out/contact-sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: newsreel-${{ steps.pick.outputs.id }}
          path: newsletter/issues/${{ steps.pick.outputs.id }}-video/out/
          retention-days: 14
      - name: Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.pick.outputs.id }}
          NUM: ${{ steps.pick.outputs.num }}
        run: |
          tag="newsletter-$ID-newsreel-${{ github.run_number }}"
          # Draft only: a person reviews and publishes the release by hand.
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Nordic Crypto #$NUM newsreel" \
            --notes "Newsreel for newsletter issue #$NUM." \
            newsletter/issues/$ID-video/out/nordic-crypto-$NUM-newsreel.mp4
          echo "### $tag" >> "$GITHUB_STEP_SUMMARY"
