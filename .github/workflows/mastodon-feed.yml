# Mirror the X feed (new events + news digests, with images) on Mastodon (@nordiccrypto@mastodon.social).
# Same feeds, texts and images as x-feed.yml; script: tools/mastodon_feed.py (reuses tools/x_feed.py).
# Secret: MASTODON_TOKEN (scopes write:statuses + write:media; the follow job also needs read + write:follows).
name: Mastodon feed (events and news)

on:
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]
  schedule:
    - cron: "24,54 * * * *"   # just after X's :22/:52
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: false
      news_ids:
        description: "Backfill: news ids to post now as one digest, comma-separated"
        type: string
        default: ""
      event_ids:
        description: "Backfill: event ids to post now, comma-separated"
        type: string
        default: ""

permissions:
  contents: read
  actions: write   # save ledgers in the Actions cache

concurrency:
  group: mastodon-feed
  cancel-in-progress: false

jobs:
  post:
    if: github.repository == 'nordic-crypto-org/nordic-crypto' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/mastodon_feed.py
            tools/x_feed.py
            tools/x_newsletter.py
            tools/x_post_image.py
            tools/telegram_events.py
            assets/brand/
            assets/fonts/
            requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow for post cards
        run: python3 -m pip install --quiet Pillow

      - name: Restore the events ledger
        uses: actions/cache/restore@v4
        with:
          path: .mastodon-feed/events-ledger.json
          key: mastodon-feed-events-ledger-${{ github.run_id }}
          restore-keys: mastodon-feed-events-ledger-

      - name: Post new events
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          EVENT_IDS: ${{ inputs.event_ids }}
        run: python3 tools/mastodon_feed.py --kind events --ledger .mastodon-feed/events-ledger.json --post "$EVENT_IDS" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save the events ledger
        if: always() && hashFiles('.mastodon-feed/events-ledger.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .mastodon-feed/events-ledger.json
          key: mastodon-feed-events-ledger-${{ github.run_id }}

      - name: Restore the news ledger
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: .mastodon-feed/news-ledger.json
          key: mastodon-feed-news-ledger-${{ github.run_id }}
          restore-keys: mastodon-feed-news-ledger-

      - name: Post new news digest
        if: ${{ !cancelled() }}
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          NEWS_IDS: ${{ inputs.news_ids }}
        run: python3 tools/mastodon_feed.py --kind news --ledger .mastodon-feed/news-ledger.json --post "$NEWS_IDS" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save the news ledger
        if: always() && hashFiles('.mastodon-feed/news-ledger.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .mastodon-feed/news-ledger.json
          key: mastodon-feed-news-ledger-${{ github.run_id }}
