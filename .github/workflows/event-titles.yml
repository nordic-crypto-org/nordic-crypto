# A commit that adds an event to data/events.json without the nightly fetch's translate step
# (e.g. 21d4ef7 "data: pending rows") breaks tests.test_event_title on main and every PR build.
# This fills the missing titles and descriptions with tools/event_translate.py and commits them to main.
# The commit is pushed with GITHUB_TOKEN, so it does not trigger this workflow again.
name: Translate new event titles

concurrency:
  group: event-titles
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - data/events.json
      - data/events_backfill.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    if: github.repository == 'nordic-crypto-org/nordic-crypto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Fill missing event titles and descriptions
        env:
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        # A language call can time out; event_translate.py fills only what is missing, so run it again.
        run: |
          for i in 1 2 3; do
            python3 tools/event_translate.py
            python3 -m unittest -q tests.test_event_title tests.test_event_translate && break
          done
          true

      - name: Commit translations
        run: |
          git add data/event_title_i18n.json data/event_description_i18n.json
          if git diff --cached --quiet; then
            echo "every event already has its translations"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Translate new event titles"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: Every event has a title and description in every language
        run: python3 -m unittest tests.test_event_title tests.test_event_translate
