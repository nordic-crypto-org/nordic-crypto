name: X daily news digest
on:
  schedule:
    - cron: "7 18,19 * * *"   # 20:07 Oslo in summer (18:07 UTC) and winter (19:07 UTC); the other run is skipped
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print only, post nothing"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: x-daily
  cancel-in-progress: false
jobs:
  post:
    if: github.repository == 'nordic-crypto-org/nordic-crypto'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Post today's digest to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          args=()
          [ "${{ github.event_name }}" = "schedule" ] && args+=(--not-before 20)
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          python3 tools/x_daily.py "${args[@]}"
      - name: Commit post state
        if: always()
        run: |
          [ -f data/x_daily_posted.json ] || exit 0
          git add data/x_daily_posted.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record X daily digest"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
