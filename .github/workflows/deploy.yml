# Build Nordic Crypto on every push to main, run the privacy gate and the text gate,
# and publish site/ to gh-pages when the repository variable NC_CI_DEPLOY is true.
# Do not enable xtrace in this workflow: NC_PRIVATE_TERMS_JSON must not be printed.
# Do not upload state/ or site/ as an artifact.
# After a successful publish, the release job creates a GitHub release for the deployed commit
# (notes only, no assets).
# After a successful publish with new stories, the deploy job also sends push notifications:
# browser push (workers/push, secret PUSH_PUBLISH_TOKEN) and the iOS/Android apps
# (nordic-crypto-org/nordic-crypto-tv push/, secret APP_PUSH_PUBLISH_TOKEN). Each is skipped
# with a notice while its secret is not set; a failed call is a warning, not a failed deploy.
name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      # These paths are not read by the public build.
      - "tests/**"
      - "research/**"
      - "docs/**"
      - "tipworker/**"
      - "routines/**"
      - "regulation-videos/storyboards/**"
      - "regulation-videos/substack/**"
      - "regulation-videos/pipeline/**"
      - "newsletter/issues/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "assets/logo-concepts/**"
      - "README.md"
      - "data/x_daily_posted.json"
  workflow_dispatch:

permissions:
  contents: write

# Shared with markets-refresh.yml. queue: max keeps every pending run (the default
# keeps one pending run and cancels the older one). A price refresh must not cancel
# a site publish. cancel-in-progress stays false; queue: max cannot be combined with true.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build, gate, publish
    if: >-
      github.repository == 'nordic-crypto-org/nordic-crypto'
      && github.actor != 'github-actions[bot]'
      && (github.event_name != 'push'
          || (!contains(github.event.head_commit.message || '', '[skip ci]')
              && !contains(github.event.head_commit.message || '', '[ci skip]')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # success only when the gh-pages publish step ran and passed; skipped when NC_CI_DEPLOY is not true.
      published: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Full history so /db/ can show the schema version and changelog (git log of schema/).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Check Node for share snippets
        run: node --version

      - name: Write privacy terms
        env:
          NC_PRIVATE_TERMS_JSON: ${{ secrets.NC_PRIVATE_TERMS_JSON }}
        run: python3 tools/ci_write_terms.py

      - name: Import committed JSON into D1
        # Same step as d1-publish.yml: fold committed data/news.json and events into D1
        # (idempotent; a newer D1 approval is kept) so a push-triggered D1 build does not drop them.
        if: vars.NC_DATA_SOURCE == 'd1'
        env:
          NC_DATA_SOURCE: d1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: python3 tools/d1_import.py

      - name: Public build
        id: build
        env:
          NC_DATA_SOURCE: ${{ vars.NC_DATA_SOURCE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          python3 build.py
          if [ -e site/.preview ]; then
            echo "::error::refusing: site/ is a preview build (site/.preview). CI never passes --preview."
            exit 1
          fi

      - name: Privacy gate
        run: python3 tools/privacy_gate.py site

      - name: Delete privacy terms
        if: always()
        run: |
          set -euo pipefail
          rm -f state/private_terms.json
          if [ -e state/private_terms.json ]; then
            echo "::error::could not delete state/private_terms.json"
            exit 1
          fi

      - name: Text gate
        run: python3 tools/text_gate.py

      - name: Summarise tracked files the build rewrote
        if: always() && steps.build.outcome == 'success'
        run: |
          {
            echo "### Tracked files the build rewrote"
            echo
            echo "CI does not commit these and does not push \`main\`. The box, which has the approvals, commits \`data/\` and \`archive/events.json\`."
            echo
            echo '```'
            git status --short
            echo '```'
            echo
            echo '```'
            git diff --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          # The gh-pages history is about 460 MB. Depth 1 is the published tree only.
          fetch-depth: 1

      - name: Compare the build with gh-pages
        run: python3 tools/ci_pages_diff.py site gh-pages | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the deploy switch and the parity gaps
        run: |
          {
            echo "### Deploy switch and parity"
            echo
            if [ "$NC_CI_DEPLOY" = "true" ]; then
              echo "\`NC_CI_DEPLOY\` is true. gh-pages will be updated."
            else
              echo "\`NC_CI_DEPLOY\` is not true. The build and both gates ran. gh-pages will not be updated."
            fi
            echo
            if [ "$NC_DATA_SOURCE" = "d1" ]; then
              echo "\`NC_DATA_SOURCE\` is d1. Approved stories and events were read from D1. A story still goes through the privacy gate and the text gate before gh-pages."
            else
              echo "\`NC_DATA_SOURCE\` is not d1. Stories and events come from the JSON files on this commit."
            fi
            echo
            echo "CI has no \`queue/approved.json\`, no \`state/source_status.json\`, and no \`/workspace/nordic-crypto-research/academia.md\`."
            echo "Own stories come from \`data/stories/approved.json\`; the local \`stories.approve\` queue is omitted. Rows in \`data/events.json\` are not promoted. Every enabled source counts as ok."
            echo "\`data/news.json\`, \`data/orgchart.json\` and \`data/academia.json\` stay as they are committed on \`main\`."
            echo "After a publish with new stories, push notifications go to browsers (\`PUSH_PUBLISH_TOKEN\`) and the apps (\`APP_PUSH_PUBLISH_TOKEN\`)."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NC_CI_DEPLOY: ${{ vars.NC_CI_DEPLOY }}
          NC_DATA_SOURCE: ${{ vars.NC_DATA_SOURCE }}

      - name: Publish to gh-pages
        id: publish
        if: vars.NC_CI_DEPLOY == 'true'
        run: |
          set -euo pipefail
          if [ -e state/private_terms.json ]; then
            echo "::error::state/private_terms.json is still on disk; refusing to publish"
            exit 1
          fi
          if [ -e site/.preview ]; then
            echo "::error::refusing: site/ is a preview build"
            exit 1
          fi
          # The live news.json before this publish, for the push step (only new story ids are sent).
          git -C gh-pages fetch -q --depth 1 origin gh-pages
          git -C gh-pages show FETCH_HEAD:data/news.json > "$RUNNER_TEMP/previous-news.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/previous-news.json"
          msg="Publish $(date -u '+%Y-%m-%d %H:%M UTC') from main@${GITHUB_SHA} [skip ci]"
          tools/ci_gh_pages.sh gh-pages site publish-keep.txt "$msg"

      - name: Check the live site
        if: vars.NC_CI_DEPLOY == 'true'
        run: |
          set -euo pipefail
          # wait_url prints a warning and does not fail the job.
          source ./publish.sh
          wait_url "https://nordiccrypto.no/" 120

      # At most one notification per publish: browsers get one batch (workers/push), each app
      # device the newest new story in its countries (the app Worker reads latest.json itself).
      - name: Push notifications for new stories
        if: vars.NC_CI_DEPLOY == 'true' && steps.publish.outcome == 'success'
        env:
          PUSH_PUBLISH_TOKEN: ${{ secrets.PUSH_PUBLISH_TOKEN }}
          APP_PUSH_PUBLISH_TOKEN: ${{ secrets.APP_PUSH_PUBLISH_TOKEN }}
          APP_PUSH_URL: ${{ vars.APP_PUSH_URL || 'https://nordic-crypto-app-push.nordiccrypto.workers.dev' }}
        run: |
          set -uo pipefail
          prev="$RUNNER_TEMP/previous-news.json"
          if [ ! -s "$prev" ]; then
            echo "::notice title=Push::No previous news.json; not sending (that would announce the whole archive)."
            exit 0
          fi
          new=$(python3 - "$prev" site/data/news.json <<'PY'
          import json, sys
          ids = lambda p: {i.get("id") for i in json.load(open(p, encoding="utf-8")).get("items", []) if i.get("id")}
          print(len(ids(sys.argv[2]) - ids(sys.argv[1])))
          PY
          ) || new=0
          echo "New stories in this publish: $new"
          if [ "${new:-0}" = 0 ]; then
            echo "No new stories; no push notifications." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Browser push. push_notify.py diffs the two files and skips when the Worker URL
          # (workers/push/public.json) or PUSH_PUBLISH_TOKEN is not set.
          python3 tools/push_notify.py --previous "$prev" --current site/data/news.json \
            || echo "::warning title=Browser push::push_notify.py failed"

          # Apps. Wait until GitHub Pages serves the latest.json built here, so the Worker sees it.
          if [ -z "$APP_PUSH_PUBLISH_TOKEN" ]; then
            echo "::notice title=App push::APP_PUSH_PUBLISH_TOKEN is not set; the app Worker's hourly check will pick this up."
            exit 0
          fi
          want=$(python3 -c 'import json;print(json.load(open("site/api/v1/news/latest.json"))["generated_at"])' 2>/dev/null || true)
          for _ in $(seq 1 40); do
            got=$(curl -fsS --max-time 15 https://nordiccrypto.no/api/v1/news/latest.json \
              | python3 -c 'import json,sys;print(json.load(sys.stdin).get("generated_at",""))' 2>/dev/null || true)
            [ -n "$want" ] && [ "$got" = "$want" ] && break
            sleep 15
          done
          [ "$got" = "$want" ] || echo "::warning title=App push::live latest.json is not this build yet; calling anyway (the hourly check retries)"
          # The token goes to curl on stdin, never on its command line.
          if out=$(printf 'Authorization: Bearer %s\n' "$APP_PUSH_PUBLISH_TOKEN" \
                | curl -fsS --max-time 60 -X POST -H @- "${APP_PUSH_URL%/}/v1/publish"); then
            echo "App push: $out" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=App push::POST /v1/publish failed; the app Worker's hourly check will pick this up."
          fi

  # One GitHub release per deployed commit on main. Runs only when the whole deploy job passed
  # (build, privacy gate, text gate, gh-pages push). It does not check out the repository and
  # gets no secrets, so state/private_terms.json and site/ never reach it. No assets are attached;
  # GitHub adds its own source archives.
  release:
    name: GitHub release
    needs: deploy
    if: >-
      needs.deploy.result == 'success'
      && needs.deploy.outputs.published == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short=${SHA:0:7}
          # Tag: deploy-<commit time, UTC, YYYY-MM-DD-HHMM>-<short sha>. The committer time belongs to
          # the commit, not to the run, so a re-run or a workflow_dispatch of the same commit picks
          # the same tag. Tags sort by time.
          committed=$(gh api "repos/${GH_REPO}/commits/${SHA}" --jq '.commit.committer.date')
          stamp=$(date -u -d "$committed" '+%Y-%m-%d-%H%M')
          tag="deploy-${stamp}-${short}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists. Skipping."
            exit 0
          fi

          # "<sha> <tag>" for every deploy-* tag.
          refs=$(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/deploy-" \
            --jq '.[] | "\(.object.sha) \(.ref | ltrimstr("refs/tags/"))"')
          other=$(awk -v sha="$SHA" -v tag="$tag" '$1 == sha && $2 != tag { print $2; exit }' <<<"$refs")
          if [ -n "$other" ]; then
            echo "Tag ${other} already marks ${SHA}. Skipping."
            exit 0
          fi
          # Generated notes start at the previous deploy release, not at a newsletter release.
          prev=$(awk -v tag="$tag" '$2 < tag { print $2 }' <<<"$refs" | sort | tail -n 1)

          notes="Deployed to https://nordiccrypto.no/ from \`main\` at commit [\`${SHA}\`](${GITHUB_SERVER_URL}/${GH_REPO}/commit/${SHA}).

          Workflow run: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          args=(--target "$SHA" --title "Deploy ${stamp} (${short})" --notes "$notes" --generate-notes --latest)
          if [ -n "$prev" ]; then
            args+=(--notes-start-tag "$prev")
          fi
          gh release create "$tag" "${args[@]}"
          echo "Created release ${tag} for ${SHA}." | tee -a "$GITHUB_STEP_SUMMARY"
